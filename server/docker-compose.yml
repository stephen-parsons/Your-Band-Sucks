services:
  # Your existing web application
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: band-app-server
    env_file:
      - .env
    # TODO: Uncomment this when ready to enable hot reloading
    # volumes:
    #   - .:/app
    #   - /app/node_modules # Prevents your local node_modules from overwriting the container's linux node_modules
    ports:
      - "3000:3000"
    environment:
      # CRITICAL: Change localhost to the service names below in your app config
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-db:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  # PostgreSQL v18 Instance
  postgres-db:
    image: postgres:18-alpine
    container_name: local_postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${EXTERNAL_DB_PORT}:5432" # Allows you to still connect via local GUI tools like PgAdmin/DBeaver
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Instance
  redis-cache:
    image: redis:7-alpine
    container_name: local_redis
    ports:
      - "6379:6379" # Allows local GUI tools to connect
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

# Persistent volumes so your data survives container restarts
volumes:
  postgres_data:
  redis_data:
